<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex">
<title>Page not found · TadaBoo</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#FFF8F0;--card:#fff;--ink:#23264A;--muted:#5C5F78;--orange:#FF6B2C;--price:#B83A0A;--line:#F0E2D4;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 "Figtree",system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header{border-bottom:2px solid color-mix(in srgb,var(--orange) 35%,transparent);background:var(--bg)}
header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:68px}
.wm{font:700 1.5rem/1 "Fredoka",system-ui;text-decoration:none;color:var(--ink)}.wm .t{color:#E2541A;font-style:italic}.wm .s{color:#FFC63A;font-size:.55em;vertical-align:.7em}
main.wrap{padding:56px 16px 80px;text-align:center}
.code{font:700 clamp(4rem,3rem + 8vw,7rem)/1 "Fredoka",system-ui;color:#E2541A;margin:0}
.code .s{color:#FFC63A;font-size:.5em;vertical-align:.5em}
h1{font:600 clamp(1.9rem,1.4rem + 2vw,2.6rem)/1.1 "Bricolage Grotesque",sans-serif;margin:8px 0 10px}
p{margin:0 0 24px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;text-decoration:none}
.btn:focus-visible,.wm:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
</style>
</head>
<body>
<header><div class="wrap"><a class="wm" href="/"><span class="t">TADA</span><span class="s">✦</span>BOO</a></div></header>
<main class="wrap">
  <p class="code" aria-hidden="true">4<span class="s">✦</span>4</p>
  <h1>Page not found</h1>
  <p>We couldn’t find that page.</p>
  <a class="btn" href="/">Back to the shop</a>
</main>
</body>
</html>
